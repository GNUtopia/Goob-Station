- type: entity
  abstract: true
  id: RobotSurgeryBase
  components:
  - type: Surgery
  - type: SurgeryPartComponentCondition
    components:
      - type: RobotSurgery

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryOpenIncision
  name: Open Maintenance Panel
  components:
  - type: Surgery
    steps:
    - RobotSurgeryStepUnlockPanel
    - RobotSurgeryStepOpenPanel
  - type: SurgeryPartPresentCondition

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryStopBloodOutput
  name: Stop Constant Blood Output
  components:
  - type: Surgery
    requirement: RobotSurgeryOpenIncision
    steps:
    - RobotSurgeryStepDisplaceWiring
    - RobotSurgeryStepCloseBloodOutputs
  - type: SurgeryBleedsPresentCondition
  - type: SurgeryPartPresentCondition

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryFixDismemberment
  name: Fix Dismemberment Leftovers
  components:
  - type: Surgery
    requirement: RobotSurgeryOpenIncision
    steps:
    - RobotSurgeryStepRepairDismembermentWires
    - RobotSurgeryStepRemoveLeftoverBones
  - type: SurgeryPartPresentCondition
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryTraumaPresentCondition
    trauma: Dismemberment

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryCloseIncision
  name: Close Maintenance Panel
  components:
  - type: Surgery
    priority: 1
    steps:
    - RobotSurgeryStepCloseBones
    - RobotSurgeryStepCloseIncision
  - type: SurgeryPartPresentCondition

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryRemovePart
  name: Remove Part
  components:
  - type: Surgery
    requirement: RobotSurgeryOpenIncision
    steps:
    - RobotSurgeryStepSawFeature
    - RobotSurgeryStepClampInternalBleeders
    - RobotSurgeryStepRemoveFeature
  - type: SurgeryHasBodyCondition
  - type: SurgeryPartCondition
    part: Chest
    inverse: true

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryMendBones
  name: Repair Structural Damage
  components:
  - type: Surgery
    requirement: RobotSurgeryOpenIncision
    steps:
    - RobotSurgeryStepDisplaceWiring
    - RobotSurgeryStepMendBones
  - type: SurgeryPartPresentCondition
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryTraumaPresentCondition
    trauma: BoneDamage

- type: entity
  parent: RobotSurgeryBase
  id: RobotSurgeryHealOrgans
  name: Repair Component Damage
  components:
  - type: Surgery
    requirement: RobotSurgeryOpenIncision
    steps:
    - RobotSurgeryStepDisplaceWiring
    - RobotSurgeryStepHealOrgans
  - type: SurgeryPartPresentCondition
  - type: SurgeryBleedsPresentCondition
    inverted: true
  - type: SurgeryTraumaPresentCondition
    trauma: OrganDamage

